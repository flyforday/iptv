name: Fabriquer l'app

# Chaque push sur main fabrique l'APK Android et l'app iPhone, puis les publie
# dans une Release GitHub. Les pull requests ne fabriquent que l'APK (plus rapide
# et économe en minutes macOS).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une nouvelle version annule la fabrication en cours de la même branche.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.7'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # Clé de signature de la famille (secrets du dépôt). Sans elle, l'APK est
      # signé avec une clé de debug : il s'installe, mais les mises à jour
      # demanderont de désinstaller l'ancienne version.
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/famille.jks
          cat > android/key.properties <<PROPS
          storeFile=famille.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=famille
          keyPassword=$KEYSTORE_PASSWORD
          PROPS

      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - run: mv build/app/outputs/flutter-apk/app-release.apk FamilleTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: FamilleTV.apk

  ios:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # Build non signé : Sideloadly ou AltStore le signent à l'installation
      # avec un identifiant Apple gratuit.
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Emballer en .ipa
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr FamilleTV.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: FamilleTV.ipa

  release:
    needs: [android, ios]
    if: github.event_name != 'pull_request' && !cancelled() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Famille TV ${{ github.run_number }}
          make_latest: true
          files: |
            FamilleTV.apk
            FamilleTV.ipa
          fail_on_unmatched_files: false
