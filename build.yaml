# Configuration de build_runner (génération du code de la base drift).
targets:
  $default:
    sources:
      - lib/**
      - pubspec.yaml
      - lib/$lib$
      - $package$
    builders:
      drift_dev:
        options:
          databases:
            default: lib/database/database.dart
          sql:
            dialect: sqlite
            options:
              version: "3.38"
              modules: [fts5]
